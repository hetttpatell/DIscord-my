  <path d="M19 46L32 15L45 46" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M24 35H40" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <!-- Radiant Spot / Live Beacon -->
  <circle cx="46" cy="17" r="7.5" fill="#23A55A" stroke="#1E1F22" stroke-width="2.5" filter="url(#spotGlow)" />
  <circle cx="46" cy="17" r="3" fill="#FFFFFF" />
